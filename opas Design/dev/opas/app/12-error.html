<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Opas — Error</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=lufga@400,500,600,700,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
#error-screen{display:flex;flex-direction:column;height:100%}
.error-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-8) var(--space-6);text-align:center}
.error-icon{width:80px;height:80px;border-radius:50%;background:rgba(255,69,58,.1);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-5)}
.error-icon svg{width:36px;height:36px}
.error-content h2{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:var(--space-2)}
.error-content p{font-size:14px;color:var(--muted);max-width:280px;line-height:1.6;margin-bottom:var(--space-6)}
.error-details{margin-top:var(--space-6);width:100%;max-width:320px;border-top:1px solid var(--border);padding-top:var(--space-4)}
.error-details summary{font-size:13px;color:var(--muted);cursor:pointer;font-weight:500;padding:var(--space-2) 0;list-style:none;display:flex;align-items:center;justify-content:space-between}
.error-details summary::-webkit-details-marker{display:none}
.error-details .detail-body{font-size:12px;color:var(--muted);font-family:var(--font-mono);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-3);margin-top:var(--space-2);line-height:1.7}
</style>
</head>
<body>
<div id="error-screen">
  <div class="status-bar"><span>9:41</span><svg width="68" height="12" viewBox="0 0 68 12" fill="none"><rect x="42" y="1" width="22" height="10" rx="3" stroke="#f5f5f7" stroke-width=".8" fill="none"/><rect x="44" y="3" width="14" height="6" rx="1.5" fill="#f5f5f7" opacity=".35"/><rect x="60" y="5" width="2" height="2" rx="1" fill="#f5f5f7"/><circle cx="9" cy="6" r="5" fill="#f5f5f7" opacity=".9"/></svg></div>

  <div class="error-content">
    <div class="error-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff453a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h2>Connection lost</h2>
    <p>Unable to reach Opas servers. Your documents are stored safely on this device.</p>
    <button class="btn btn-primary btn-lg" onclick="location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Try again
    </button>

    <details class="error-details">
      <summary>
        <span>Technical details</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </summary>
      <div class="detail-body">
Error: FETCH_ERR_NETWORK<br>
Endpoint: api.opas.app/v1/sync<br>
Timestamp: 2026-06-23T09:41:00Z<br>
Retry: 3 of 5<br>
User-Agent: Opas iOS/1.0.0
      </div>
    </details>
  </div>

  <nav class="glass-nav">
    <button class="tab" onclick="window.location.href='03-home.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg><span>Home</span>
    </button>
    <button class="tab" onclick="window.location.href='05-search.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg><span>Search</span>
    </button>
    <button class="tab-scan" onclick="window.location.href='06-scan.html'">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 012 2v4M9 21H5a2 2 0 01-2-2v-4M21 15v4a2 2 0 01-2 2h-4M9 3H5a2 2 0 00-2 2v4"/></svg>
    </button>
    <button class="tab" onclick="window.location.href='09-folders.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16a2 2 0 002-2V8a2 2 0 00-2-2h-7l-2-2H4a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span>Folders</span>
    </button>
    <button class="tab" onclick="window.location.href='10-profile.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span>
    </button>
  </nav>
</div>
<script src="js/app.js"></script>
</body>
</html>
