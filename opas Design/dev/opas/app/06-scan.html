<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Opas — Scan</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=lufga@400,500,600,700,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
#scan-screen{background:#0a0a0a;height:100%;display:flex;flex-direction:column}
.scan-top{display:flex;align-items:center;justify-content:space-between;padding:var(--safe-top,48px) var(--space-5) var(--space-6);flex-shrink:0}
.scan-top .close-btn{width:40px;height:40px;border-radius:50%;background:rgba(28,28,30,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.7);transition:all .15s}
.scan-top .close-btn:active{transform:scale(.9)}
.scan-top .title{font-size:16px;font-weight:600;color:rgba(255,255,255,.8)}
.scan-top .gallery-btn{width:40px;height:40px;border-radius:50%;background:rgba(28,28,30,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.7);transition:all .15s}
.scan-top .gallery-btn:active{transform:scale(.9)}
.viewfinder-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.corner-frame{width:280px;height:380px;position:relative}
.corner-frame .corner{position:absolute;width:36px;height:36px;border-color:var(--accent);border-style:solid;border-width:0}
.corner-frame .tl{top:0;left:0;border-top-width:3px;border-left-width:3px;border-radius:4px 0 0 0}
.corner-frame .tr{top:0;right:0;border-top-width:3px;border-right-width:3px;border-radius:0 4px 0 0}
.corner-frame .bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 4px}
.corner-frame .br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 4px 0}
.corner-label{position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.4);font-size:13px;white-space:nowrap}
.scan-tools{display:flex;align-items:center;justify-content:center;gap:48px;padding:var(--space-8) var(--space-6) var(--space-12);flex-shrink:0}
.scan-tool{width:52px;height:52px;border-radius:50%;background:rgba(28,28,30,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.7)}
.scan-tool:active{transform:scale(.9)}
.scan-capture{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.scan-capture:active{transform:scale(.88)}
.scan-capture .inner{width:60px;height:60px;border-radius:50%;background:#fff}
</style>
</head>
<body>
<div id="scan-screen">
  <div class="scan-top">
    <button class="close-btn" onclick="showScreen('03-home')" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <span class="title">Scan Document</span>
    <button class="gallery-btn" onclick="openSheet('gallery-sheet')" aria-label="Upload from gallery">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
  </div>

  <div class="viewfinder-wrap">
    <div class="corner-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="corner-label">Align document within frame</div>
    </div>
  </div>

  <div class="scan-tools">
    <button class="scan-tool" onclick="showToast('Flash on')" aria-label="Flash">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </button>
    <button class="scan-capture" onclick="captureScan()" aria-label="Capture">
      <div class="inner"></div>
    </button>
    <button class="scan-tool" onclick="showToast('Auto-frame: ON')" aria-label="Auto-frame">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 012 2v4M9 21H5a2 2 0 01-2-2v-4M21 15v4a2 2 0 01-2 2h-4M9 3H5a2 2 0 00-2 2v4"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</div>

<div id="gallery-sheet" class="sheet-overlay" onclick="closeSheet('gallery-sheet')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-row" onclick="closeSheet('gallery-sheet');showToast('Gallery opened')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span>Upload from Gallery</span>
    </div>
    <div class="sheet-row" onclick="closeSheet('gallery-sheet');showToast('Files opened')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Browse Files</span>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
function showToast(msg){
  const existing=document.querySelector('.toast');
  if(existing)existing.remove();
  const t=document.createElement('div');t.className='toast';
  t.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#92d9bb" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>'+msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
</script>
</body>
</html>
