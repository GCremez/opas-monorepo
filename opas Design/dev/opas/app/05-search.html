<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Opas — Search</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=lufga@400,500,600,700,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
.search-header{display:flex;align-items:center;gap:var(--space-2);padding:0 0 var(--space-4)}
.back-btn{width:40px;height:40px;border-radius:50%;background:none;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .15s}
.back-btn:hover{color:var(--fg)}
.search-bar-wrap{flex:1;position:relative}
.search-bar-wrap .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;width:18px;height:18px}
.search-bar-wrap .search-icon svg{width:18px;height:18px}
.search-input{font-family:var(--font-body);font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px 12px 40px;width:100%;outline:none;transition:all .15s;height:44px}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-input::placeholder{color:var(--muted)}
.search-body{margin-top:var(--space-2)}
.search-body h3{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:var(--space-3)}
.result-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-2);border-radius:var(--radius-md);cursor:pointer;transition:background .15s}
.result-item:active{background:var(--surface)}
.result-item .icon-box{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.result-item .icon-box svg{width:18px;height:18px}
.result-item .info{flex:1;min-width:0}
.result-item .info .name{font-size:14px;font-weight:500}
.result-item .info .meta{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="05-search" class="screen">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1.5" stroke="#86868b" stroke-width="1"/><path d="M14 3v6" stroke="#86868b" stroke-width="1.2" stroke-linecap="round"/><path d="M15.5 4.5v3" stroke="#86868b" stroke-width="1.2" stroke-linecap="round"/></svg>
    </div>
  </div>
  <div class="content" style="padding-top:var(--space-2)">
    <div class="search-header">
      <button class="back-btn" onclick="showScreen('03-home')" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="search-bar-wrap">
        <div class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg></div>
        <input id="search-input" class="search-input" type="search" placeholder="Search documents, folders…" autocomplete="off" autofocus>
      </div>
    </div>

    <div class="search-body" id="search-results">
      <h3>Recent</h3>
      <div class="result-item" onclick="showScreen('08-document')">
        <div class="icon-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#92d9bb" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="info"><div class="name">KELA — Housing Benefit</div><div class="meta">2 pages • Finnish</div></div>
      </div>
      <div class="result-item" onclick="showScreen('08-document')">
        <div class="icon-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="info"><div class="name">Tax Card 2025</div><div class="meta">1 page • Finnish</div></div>
      </div>
      <div class="result-item" onclick="showScreen('08-document')">
        <div class="icon-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff9f0a" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="info"><div class="name">Residence Permit Extension</div><div class="meta">5 pages • Swedish</div></div>
      </div>
      <div class="result-item" onclick="showScreen('08-document')">
        <div class="icon-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#92d9bb" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="info"><div class="name">Finnish Tax Decision 2024</div><div class="meta">2 pages • Finnish</div></div>
      </div>
      <div class="result-item" onclick="showScreen('08-document')">
        <div class="icon-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="info"><div class="name">Employment Contract Review</div><div class="meta">4 pages • English</div></div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
