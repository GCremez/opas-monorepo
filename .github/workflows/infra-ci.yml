name: Infra CI

# Validation runs automatically; deploys only run when started by hand.
on:
  push:
    branches: [main, develop]
    paths: ['opas-infra/**', 'opas-backend/src/main/resources/presidio/**', 'opas-backend/src/test/resources/redaction/**', '.github/workflows/infra-ci.yml']
  pull_request:
    branches: [main]
    paths: ['opas-infra/**', 'opas-backend/src/main/resources/presidio/**', 'opas-backend/src/test/resources/redaction/**', '.github/workflows/infra-ci.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the CloudFormation stack to staging and production'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: opas-infra

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose file syntax
        run: docker compose config --quiet
      - name: Lint CloudFormation
        run: |
          pipx run cfn-lint cloudformation/ecs.yml

  integration:
    name: Local stack smoke test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start services
        run: docker compose up -d --wait --wait-timeout 300
      - run: docker compose ps
      - name: PostgreSQL
        run: |
          docker exec opas-postgres pg_isready -U opas
          docker exec opas-postgres psql -U opas -d opas -c "SELECT extname FROM pg_extension;"
      - name: Redis
        run: docker exec opas-redis redis-cli ping
      - name: RabbitMQ
        run: docker exec opas-rabbitmq rabbitmq-diagnostics check_running
      - name: LocalStack
        run: |
          curl -sf http://localhost:4566/_localstack/health | jq .
          docker exec opas-localstack awslocal s3 ls
      - name: Prometheus
        run: curl -sf http://localhost:9090/-/healthy
      - name: Grafana
        run: curl -sf http://localhost:3001/api/health
      - name: Presidio
        run: |
          curl -sf http://localhost:5001/health
          curl -sf http://localhost:5002/health
      - name: Presidio redaction (Finnish, Swedish and English letters)
        # Inside the built image, with its own models and config: personal data removed,
        # dates, amounts, reference numbers and authority names kept.
        run: |
          for letters in /test/letters.txt /redaction/sample-letters.txt; do
            # The image runs Presidio from its source in /app instead of installing it,
            # so the test needs /app on the import path.
            docker run --rm -e PYTHONPATH=/app \
              -v "$PWD/presidio/test:/test:ro" \
              -v "$PWD/../opas-backend/src/main/resources/presidio:/opas:ro" \
              -v "$PWD/../opas-backend/src/test/resources/redaction:/redaction:ro" \
              opas-presidio-analyzer python /test/check_redaction.py /opas "$letters"
          done
      - name: Presidio diagnostics on failure
        if: failure()
        run: |
          for c in opas-presidio-analyzer opas-presidio-anonymizer; do
            echo "== $c: processes"
            docker top "$c" || true
            echo "== $c: health checks"
            docker inspect --format '{{json .State.Health}}' "$c" | jq . || true
            # Print where every gunicorn process is stuck (PYTHONFAULTHANDLER=1).
            docker exec -i "$c" python - < presidio/test/dump_stacks.py || true
          done
          sleep 2
          docker compose logs --no-color --tail=400 presidio-analyzer presidio-anonymizer
      - name: Tear down
        if: always()
        run: docker compose down -v

  security-scan:
    name: Image scan
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ['pgvector/pgvector:pg16', 'redis:7-alpine', 'rabbitmq:3-management-alpine']
    steps:
      - id: name
        run: echo "slug=$(echo '${{ matrix.image }}' | tr '/:' '--')" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/${{ matrix.image }}
          format: sarif
          # Actions run from the workspace root; defaults.run.working-directory only
          # applies to `run` steps.
          output: trivy-${{ steps.name.outputs.slug }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-${{ steps.name.outputs.slug }}.sarif
          category: trivy-${{ steps.name.outputs.slug }}

  # Needs the backing services and the opas/<env>/* secrets to exist in AWS first.
  # ImageTag isn't passed, so the stack keeps the image
  # the backend pipeline last deployed.
  deploy-staging:
    name: Deploy — staging
    needs: integration
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-north-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: opas-infra-deploy
      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/ecs.yml \
            --stack-name opas-infra-staging \
            --parameter-overrides \
              Environment=staging \
              VpcId=${{ vars.INFRA_VPC_ID }} \
              PublicSubnets=${{ vars.INFRA_PUBLIC_SUBNETS }} \
              CertificateArn=${{ vars.INFRA_CERT_ARN }} \
              MailFromAddress=${{ vars.MAIL_FROM || 'no-reply@getopas.app' }} \
              StripePremiumPriceIds=${{ vars.STRIPE_PREMIUM_PRICE_IDS }} \
              PresidioLanguages=${{ vars.PRESIDIO_LANGUAGES || 'en' }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --no-cli-pager

  deploy-production:
    name: Deploy — production
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-north-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: opas-infra-prod-deploy
      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/ecs.yml \
            --stack-name opas-infra-production \
            --parameter-overrides \
              Environment=production \
              VpcId=${{ vars.INFRA_VPC_ID }} \
              PublicSubnets=${{ vars.INFRA_PUBLIC_SUBNETS }} \
              CertificateArn=${{ vars.INFRA_CERT_ARN }} \
              MailFromAddress=${{ vars.MAIL_FROM || 'no-reply@getopas.app' }} \
              StripePremiumPriceIds=${{ vars.STRIPE_PREMIUM_PRICE_IDS }} \
              PresidioLanguages=${{ vars.PRESIDIO_LANGUAGES || 'en' }} \
              CorsAllowedOrigins=https://getopas.app \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --no-cli-pager
