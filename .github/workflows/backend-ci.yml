name: Backend CI

# Tests run automatically on every push and pull request.
# Deploys to AWS only run when started by hand (Actions tab → Run workflow).
on:
  push:
    branches: [main, develop]
    paths:
      - 'opas-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'opas-backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Build image and deploy to staging and production'
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opas-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opas-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Integration tests start their own PostgreSQL and Redis with Testcontainers.
      - name: Run tests
        run: mvn verify --no-transfer-progress

  build:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: opas-backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    needs: security-scan
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      ECS_CLUSTER: opas-staging
      ECS_SERVICE: opas-backend
      TASK_DEF_FILE: opas-infra/cloudformation/task-definition-staging.json
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-north-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: opas-backend-deploy

      - name: Render task definition
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -e "s/ACCOUNT_ID_PLACEHOLDER/${ACCOUNT_ID}/g" \
              "${TASK_DEF_FILE}" > /tmp/task-definition.json

      - name: Deploy to ECS
        run: |
          aws ecs deploy \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition /tmp/task-definition.json \
            --image-overrides "backend=${{ env.IMAGE }}:${{ github.sha }}" \
            --codepipeline false \
            --no-cli-pager

      - name: Verify deployment
        run: |
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ECS_CLUSTER: opas-prod
      ECS_SERVICE: opas-backend
      TASK_DEF_FILE: opas-infra/cloudformation/task-definition-production.json
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-north-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: opas-backend-prod-deploy

      - name: Render task definition
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -e "s/ACCOUNT_ID_PLACEHOLDER/${ACCOUNT_ID}/g" \
              "${TASK_DEF_FILE}" > /tmp/task-definition.json

      - name: Deploy to ECS
        run: |
          aws ecs deploy \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition /tmp/task-definition.json \
            --image-overrides "backend=${{ env.IMAGE }}:${{ github.sha }}" \
            --codepipeline false \
            --no-cli-pager

      - name: Verify deployment
        run: |
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"
