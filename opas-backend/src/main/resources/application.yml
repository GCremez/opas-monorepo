spring:
  application:
    name: opas-backend

  datasource:
    # No production host as a default — that leaks infra and risks silently
    # falling back to the prod DB when DATABASE_URL is unset. Default to local dev.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/opas}
    username: ${DATABASE_USER:opas}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      leak-detection-threshold: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 5

  ai:
    embedding:
      transformer:
        enabled: true

server:
  port: 8080
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30

opas:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  presidio:
    url: ${PRESIDIO_SIDECAR_URL:http://localhost:5001}
    # The anonymizer is a separate Presidio service from the analyzer above.
    anonymizer-url: ${PRESIDIO_ANONYMIZER_URL:http://localhost:5002}
    # Language the PII analyzer runs in. Opas documents are Finnish/Swedish, so set
    # this to the document language and load the matching model in the Presidio
    # container; defaulting to English under-detects Finnish PII (e.g. henkilotunnus).
    language: ${PRESIDIO_LANGUAGE:en}
  s3:
    bucket: ${S3_BUCKET_NAME:opas-app-bucket}
    region: ${AWS_REGION:eu-north-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    endpoint: ${AWS_ENDPOINT_URL:}
    upload-ttl-minutes: 15
  ai:
    # Claude via the official Anthropic SDK (see ClaudeClient). claude-sonnet-4-20250514
    # was retired; Sonnet 5.5 is its successor.
    api-key: ${ANTHROPIC_API_KEY}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
    # Room for the model's thinking plus a full JSON decode or letter, without streaming.
    max-tokens: 16000
    # Anthropic retries a refused request on a fallback model (server-side, "default" mode).
    refusal-fallback: ${ANTHROPIC_REFUSAL_FALLBACK:true}
    # USD per million tokens, for the opas.decode.cost_usd metric. Update with the model.
    input-price-per-mtok: 2.00
    output-price-per-mtok: 10.00
  textract:
    # OCR for photographed letters. Textract has no eu-north-1 endpoint, so it runs in
    # Frankfurt by default. Keys/endpoint are only for local dev (S3 on LocalStack, OCR on
    # real AWS); deployed tasks use the ECS task role.
    region: ${TEXTRACT_REGION:eu-central-1}
    access-key: ${TEXTRACT_ACCESS_KEY:}
    secret-key: ${TEXTRACT_SECRET_KEY:}
    endpoint: ${TEXTRACT_ENDPOINT_URL:}
  ses:
    # Dedicated SES client config. Unset in deployments — falls back to the S3 region
    # and the default credential chain (ECS task role). Set locally to send real
    # email while S3 stays on LocalStack.
    region: ${SES_REGION:}
    access-key: ${SES_ACCESS_KEY:}
    secret-key: ${SES_SECRET_KEY:}
    endpoint: ${SES_ENDPOINT_URL:}
  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    return-base-url: ${STRIPE_RETURN_BASE_URL:https://opas.app}
    # Comma-separated Stripe price IDs the client is allowed to check out with.
    # Without this allowlist a user could check out with any (e.g. $0) price and
    # still be upgraded to premium by the webhook.
    premium-price-ids: ${STRIPE_PREMIUM_PRICE_IDS:}
  mail:
    # MUST be true in every deployed environment, otherwise the hard email-verification
    # gate can never be satisfied (codes are only logged, not sent). Left false by default
    # so local dev works without an SES sender identity — read the code from the app log.
    enabled: ${MAIL_ENABLED:false}
    # A verified SES sender identity (address or domain) in the configured AWS region.
    from: ${MAIL_FROM:no-reply@opas.fi}
  free-tier:
    monthly-decode-limit: 5

logging:
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","logger":"%logger{36}","msg":"%msg","trace":"%X{traceId}"}%n'
  level:
    root: INFO
    # INFO by default in all deployed environments; raise to DEBUG locally via
    # LOGGING_LEVEL_COM_OPAS=DEBUG rather than baking verbose logging into the image.
    com.opas: ${LOGGING_LEVEL_COM_OPAS:INFO}
